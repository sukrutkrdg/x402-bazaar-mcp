# Smithery configuration for x402-bazaar-mcp
# Docs: https://smithery.ai/docs
#
# If Smithery scans the repo root (sukrutkrdg/402) rather than this subfolder,
# copy this file to the repo root or point Smithery at the `mcp` directory.
#
# PREFER THE HOSTED SERVER. We are listed on Smithery as a stdio server, which
# means an agent has to `npx`-install it and hand it a key in env. Every x402
# server on Smithery with real usage is `remote: true`, and a stdio entry cannot
# be added as a Claude custom connector or a ChatGPT connector at all — both
# require an internet-reachable HTTPS endpoint. Ours has existed since 0.3.0:
#
#     https://402.com.tr/mcp        (Streamable HTTP, one tool per service, no install)
#
# The stdio block below is kept because it still works and some clients want it,
# but the listing should point at the URL above. Update it in the Smithery
# dashboard (Add/Edit server -> URL) rather than here — Smithery takes the remote
# URL through the UI/CLI, not through this file.
startCommand:
  type: stdio
  # Nothing is required — with no config the server runs on the FREE tier (one
  # call/day/service, then a preview), so users can try every tool instantly.
  # Add a prepaid credit token (recommended) or a wallet key to unlock paid calls.
  configSchema:
    type: object
    required: []
    properties:
      creditToken:
        type: string
        title: Prepaid credit token (recommended)
        description: >-
          A credit token (ck_…) from the buy-credits service (one x402 settlement
          mints it — see https://402.com.tr/agents). Sent as the x-credit-token
          header; each call debits your prepaid balance, with no wallet or
          signing per call — the safest paid mode.
      agentPrivateKey:
        type: string
        title: Agent wallet private key (alternative)
        description: >-
          Private key of a Base wallet holding USDC. Used locally to sign x402
          payments (gasless for the payer). Only used if no credit token is set.
          Use a dedicated low-balance wallet.
      catalogUrl:
        type: string
        title: Catalog URL
        default: https://402.com.tr/api/catalog
        description: Override the x402 Bazaar catalog endpoint (optional).
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "x402-bazaar-mcp"],
      env: {
        ...(config.creditToken ? { X402_CREDIT_TOKEN: config.creditToken } : {}),
        ...(config.agentPrivateKey ? { AGENT_PRIVATE_KEY: config.agentPrivateKey } : {}),
        ...(config.catalogUrl ? { X402_BAZAAR_CATALOG: config.catalogUrl } : {})
      }
    })
